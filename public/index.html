<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Gabriel Horowitz</title>
<meta name="description" content="Book reviews, projects and cool stuff, written under a big sky.">
<meta name="theme-color" content="#04050a">
<link rel="icon" href="data:,">
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&amp;family=Montserrat:wght@500;800&amp;family=Cormorant+Garamond:wght@500;700&amp;family=Anton&amp;family=Instrument+Serif:ital@0;1&amp;family=Antic+Didone&amp;family=Geologica:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Libre+Caslon+Display&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;family=Courier+Prime:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style id="site-style">
/* Layout: night sky fixed behind everything; a floating pill nav of tabs; each tab = intro blocks then a grid of square post cards; post pages read like a Substack article on a dark glass column */
:root{
  --sky:#04050a; --glass:rgba(8,10,18,.78); --glass-2:rgba(16,19,32,.86); --raise:#161a28;
  --fg:#f3f4f8; --body:#d9dbe4; --muted:#9a9fb3; --dim:#5d6276;
  --line:rgba(220,228,255,.13); --line-strong:rgba(220,228,255,.34);
  --accent:#cfe0ff; --grass:#24438f; --danger:#ff9484; --ok:#9fe3b5;
  --onfg:#05060b; --page:#05060b; --codebg:#070912; --ebar:rgba(5,6,11,.95); --field:rgba(0,0,0,.3); --navbg:rgba(8,10,18,.82);
  --display:"Antic Didone",Didot,"Bodoni MT",serif;
  --sans:"Geologica",ui-sans-serif,system-ui,sans-serif;
  --read:"Source Serif 4",Georgia,serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
:root[data-font="bookish"]{--display:"Libre Caslon Display",Georgia,serif;--sans:"Source Serif 4",Georgia,serif}
:root[data-font="typewriter"]{--display:"Courier Prime","Courier New",monospace;--read:"Courier Prime","Courier New",monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--sky);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky)}
body.noscroll{overflow:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.mono{font-family:var(--mono)}
.tab{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}

/* sky */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#sky-img{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center}
#sky-img::after{content:"";position:absolute;inset:0;background:#000;opacity:var(--dimv,.45)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border:1px solid var(--line-strong);background:transparent;cursor:pointer;font-family:var(--sans);font-weight:500;font-size:14px;letter-spacing:.02em;text-decoration:none;transition:background .2s,border-color .2s,color .2s}
.btn:hover{background:rgba(255,255,255,.06);border-color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--onfg);border-color:var(--fg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.xs{padding:5px 9px;font-size:12px;font-family:var(--mono)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.btn.danger{color:var(--danger);border-color:rgba(255,148,132,.4)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.plus{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);display:inline-grid;place-items:center;font-size:22px;line-height:1;background:var(--glass);cursor:pointer;transition:transform .2s,background .2s}
.plus:hover{transform:rotate(90deg);background:var(--fg);color:var(--onfg)}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:50;background:radial-gradient(70% 60% at 50% 55%,#0e1018 0%,#000 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));overflow-y:auto;transition:background 1.1s ease}
#loader .ui{transition:opacity .5s ease,transform .6s ease}
#loader.launching{background:transparent}
#loader.launching .ui{opacity:0;transform:translateY(16px);pointer-events:none}
.welcome{width:min(460px,100%);text-align:center;display:grid;gap:14px}
.welcome h1{font-size:clamp(44px,9vw,72px);line-height:1;letter-spacing:-.02em}
.welcome p{color:var(--muted);margin:0}
.subbox{display:flex;border:1px solid var(--line-strong);background:rgba(10,12,20,.7);margin-top:8px}
.subbox input{flex:1;min-width:0;background:transparent;border:0;padding:14px 16px;font-size:15px}
.subbox input:focus{outline:none}
.subbox button{border:0;border-left:1px solid var(--line-strong);background:var(--fg);color:var(--onfg);padding:0 20px;font-weight:600;cursor:pointer}
.subbox button:hover{background:var(--accent)}
.submsg{font-family:var(--mono);font-size:12px;color:var(--muted);min-height:18px}
.submsg.ok{color:var(--ok)}.submsg.err{color:var(--danger)}
.lbox{display:grid;gap:18px;justify-items:center}
.frame{width:230px;height:200px;border:1px solid rgba(255,255,255,.14);display:grid;place-items:center}
#lorb{width:200px;height:200px}
.lbar{width:230px;height:46px;display:grid;align-content:center;gap:10px}
.lrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.ltrack{height:1px;background:rgba(255,255,255,.12)}
.lfill{height:1px;background:var(--fg);width:0;transition:width .12s linear}
#launch{width:230px;height:46px;font-family:var(--mono);font-size:14px;letter-spacing:.42em;padding-left:.42em;border:1px solid var(--fg);background:transparent;cursor:pointer;animation:glow 1.6s ease-in-out infinite}
#launch:hover{background:var(--fg);color:#000}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(207,224,255,0)}50%{box-shadow:0 0 28px 2px rgba(207,224,255,.25)}}
.skip{font-family:var(--mono);font-size:11.5px;color:var(--dim);background:none;border:0;cursor:pointer;letter-spacing:.08em}
.skip:hover{color:var(--muted)}
#rocket{position:fixed;z-index:55;width:46px;height:150px;pointer-events:none;will-change:transform}
#exhaust{position:fixed;inset:0;z-index:54;pointer-events:none;width:100%;height:100%}

/* ---------- site ---------- */
#site{position:relative;z-index:1;min-height:100vh;padding-bottom:120px;transition:opacity .8s ease}
#site.pre{opacity:0}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:20;margin:12px auto 0;width:max-content;max-width:calc(100vw - 24px);display:flex;align-items:center;gap:4px;padding:6px 6px 6px 18px;background:var(--navbg);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav .brand{font-family:var(--display);font-size:19px;white-space:nowrap;margin-right:12px;text-decoration:none}
.nav .tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav .tabs::-webkit-scrollbar{display:none}
.nav .tabs a{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);text-decoration:none;padding:9px 12px;white-space:nowrap;border-bottom:1px solid transparent}
.nav .tabs a:hover{color:var(--fg)}
.nav .tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}
.nav .own{display:flex;gap:2px;border-left:1px solid var(--line);margin-left:6px;padding-left:6px}
.nav .own button{font-family:var(--mono);font-size:12px;background:none;border:0;padding:9px 10px;color:var(--fg);cursor:pointer;white-space:nowrap}
.nav .own button:hover{color:var(--accent)}
.nav .own .cnt{color:var(--muted)}
@media (max-width:760px){.nav{width:auto;margin:12px 12px 0;flex-wrap:wrap;padding:8px 8px 4px 14px}.nav .brand{flex:1}.nav .tabs{order:3;width:100%}.nav .own{order:2;width:100%;overflow-x:auto;scrollbar-width:none;border-left:0;margin-left:0;padding-left:0}.nav .own::-webkit-scrollbar{display:none}}

.tabhead{padding-block:70px 30px;display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.tabhead h1{font-size:clamp(52px,9vw,112px);line-height:.95;letter-spacing:-.025em;text-shadow:0 2px 30px rgba(0,0,0,.6)}
.tabhead .tl{color:var(--body);max-width:36em;margin:16px 0 0;font-size:18px;text-shadow:0 1px 12px rgba(0,0,0,.8)}

/* blocks */
.blocks{display:grid;gap:26px;margin-bottom:40px}
.blk{position:relative}
.blk-heading h2{font-size:clamp(30px,4.5vw,48px);line-height:1.05}
.blk-heading.s h2{font-size:clamp(22px,3vw,30px)}
.blk-text{font-size:18px;color:var(--body);max-width:44em;line-height:1.7}
.blk-text p{margin:0 0 .8em}
.blk-image figure{margin:0}
.blk-image img{display:block;width:100%;border:1px solid var(--line)}
.blk-image.narrow{max-width:560px}.blk-image.wide{max-width:880px}
.blk-image figcaption,.blk-it figcaption{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.blk-it{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:32px;align-items:center;background:var(--glass);border:1px solid var(--line);padding:24px}
.blk-it.right{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}.blk-it.right .it-img{order:2}
.blk-it img{width:100%;display:block}
.blk-it .it-txt{font-size:17px;color:var(--body);line-height:1.7}
@media (max-width:700px){.blk-it,.blk-it.right{grid-template-columns:minmax(0,1fr)}.blk-it.right .it-img{order:0}}
.blk-divider hr{border:0;border-top:1px solid var(--line-strong);margin:8px 0}
.blk-spacer{height:var(--h,40px)}
.blk-ph{display:grid;place-items:center;aspect-ratio:16/7;border:1px dashed var(--line-strong);color:var(--muted);font-family:var(--mono);font-size:12px;background:var(--glass)}

/* grid of posts */
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:22px}
@media (max-width:980px){.grid{grid-template-columns:repeat(min(var(--cols,3),2),minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{display:flex;flex-direction:column;text-decoration:none;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .25s,transform .25s;min-width:0;position:relative;animation:pop .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 160ms)}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.card:hover{border-color:var(--line-strong);transform:translateY(-3px)}
.sq{aspect-ratio:1/1;width:100%;max-width:100%;overflow:hidden;position:relative;border-bottom:1px solid var(--line)}
.sq img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .sq img{transform:scale(1.035)}
.sq.gen{display:grid;align-content:end;padding:22px;background:radial-gradient(circle at 70% 25%,rgba(207,224,255,.18),transparent 45%),radial-gradient(rgba(255,255,255,.55) .7px,transparent 1px) 0 0/23px 23px,radial-gradient(rgba(255,255,255,.3) .6px,transparent 1px) 11px 7px/31px 31px,linear-gradient(160deg,#0d1226,#05060b 70%)}
.sq.gen span{font-family:var(--display);font-size:clamp(26px,3vw,36px);line-height:1.05;color:#f3f4f8}
.sq.gen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18%;background:var(--grass);clip-path:polygon(0 60%,6% 40%,11% 58%,18% 30%,24% 55%,31% 42%,38% 60%,45% 35%,52% 52%,60% 38%,67% 57%,74% 33%,81% 50%,88% 36%,94% 55%,100% 42%,100% 100%,0 100%);opacity:.85}
.sq.gen span{position:relative;z-index:1;margin-bottom:16%}
.card .cbody{padding:18px 20px 22px;display:grid;gap:8px}
.card .cmeta{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em;display:flex;gap:10px;flex-wrap:wrap}
.card h3{font-size:24px;line-height:1.15}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;padding:3px 7px;border:1px dashed var(--line-strong);color:var(--muted)}
.badge.sched{border-style:solid;color:var(--accent)}
.addcard{display:grid;place-items:center;gap:10px;align-content:center;min-height:240px;border:1px dashed var(--line-strong);background:var(--glass);color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:12.5px;animation:pop .7s both;animation-delay:calc(var(--i,0) * 160ms)}
.addcard:hover{color:var(--fg);border-color:var(--fg)}
.empty{border:1px dashed var(--line-strong);background:var(--glass);padding:44px 28px;color:var(--muted);text-align:center}
.empty strong{display:block;font-family:var(--display);font-weight:400;font-size:30px;color:var(--fg);margin-bottom:6px}

/* post page */
.post{max-width:760px;margin:46px auto 0;background:var(--glass-2);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:46px 50px;padding-left:max(22px,min(56px,6vw));padding-right:max(22px,min(56px,6vw))}
@media (max-width:800px){.post{margin-left:12px;margin-right:12px}}
.back{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--fg)}
.post h1{font-size:clamp(38px,6vw,60px);line-height:1.05;letter-spacing:-.015em;margin:26px 0 14px}
.post .sub{font-family:var(--read);font-size:21px;color:var(--muted);margin:0 0 26px;line-height:1.45}
.byline{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;flex-wrap:wrap}
.byline b{color:var(--fg);font-weight:500;font-family:var(--sans);font-size:14px;letter-spacing:0}
.av{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-family:var(--display);font-size:15px;background:var(--raise)}
.social{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-block:1px solid var(--line);padding-block:10px;margin:22px 0 0}
.social .l{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:transparent;cursor:pointer;font-family:var(--mono);font-size:12.5px;color:var(--body)}
.pill:hover{border-color:var(--line-strong)}
.pill.on{color:#ff8fa3;border-color:rgba(255,143,163,.5)}
.pill[disabled]{cursor:default;opacity:.6}
.coverimg{width:100%;margin-top:28px;border:1px solid var(--line);display:block}

/* prose shared by post + editor */
.prose{font-family:var(--read);font-size:19px;line-height:1.75;color:var(--body);overflow-wrap:break-word}
.prose > *{margin:0 0 1.1em}
.prose h2{font-size:32px;color:var(--fg);margin:1.5em 0 .5em;line-height:1.15}
.prose h3{font-size:25px;color:var(--fg);margin:1.4em 0 .45em}
.prose h4{font-family:var(--sans);font-weight:600;font-size:17px;letter-spacing:.02em;color:var(--fg);margin:1.3em 0 .4em}
.prose a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:4px}
.prose strong,.prose b{color:var(--fg);font-weight:600}
.prose blockquote{border-left:2px solid var(--fg);margin-left:0;padding-left:20px;color:var(--fg)}
.prose blockquote.pull{border:0;border-block:1px solid var(--line-strong);padding:22px 0;text-align:center;font-family:var(--display);font-size:30px;line-height:1.3}
.prose code{font-family:var(--mono);font-size:.82em;background:var(--raise);border:1px solid var(--line);padding:1px 6px}
.prose pre{font-family:var(--mono);font-size:14.5px;line-height:1.6;background:var(--codebg);border:1px solid var(--line);padding:16px 18px;overflow-x:auto;white-space:pre}
.prose pre code{border:0;background:none;padding:0}
.prose ul,.prose ol{padding-left:1.3em}
.prose li{margin:.3em 0}
.prose hr{border:0;text-align:center;margin:2em 0;overflow:visible;height:auto}
.prose hr::after{content:"✦  ✦  ✦";font-size:13px;color:var(--muted);letter-spacing:.5em}
.prose figure{margin:1.6em 0}
.prose figure img,.prose figure video{width:100%;display:block;border:1px solid var(--line)}
.prose figcaption{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px;min-height:1em}
.prose .w-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.prose .w-gallery img{aspect-ratio:1;object-fit:cover}
.prose sup.fn{font-family:var(--mono);font-size:.62em;color:var(--accent);cursor:help;padding:0 2px}
.prose sup.fn a{text-decoration:none;color:var(--accent)}
.footnotes{border-top:1px solid var(--line);margin-top:2.4em;padding-top:1em;font-size:15px;color:var(--muted)}
.footnotes ol{padding-left:1.2em}
.w-btn,.w-poll,.w-paywall,.w-embed{font-family:var(--sans);margin:1.6em 0;user-select:none}
.w-btn{text-align:center}
.w-btn a,.w-btn span.b{display:inline-block;padding:13px 26px;background:var(--fg);color:var(--onfg) !important;text-decoration:none !important;font-weight:600;font-size:15px;cursor:pointer;border:0}
.w-btn a:hover,.w-btn span.b:hover{background:var(--accent)}
.w-poll{border:1px solid var(--line-strong);padding:20px;background:var(--field)}
.w-poll .q{font-family:var(--display);font-size:24px;color:var(--fg);margin-bottom:14px;line-height:1.2}
.w-poll .opt{display:block;width:100%;text-align:left;position:relative;border:1px solid var(--line);background:transparent;padding:11px 14px;margin-top:8px;cursor:pointer;font-size:15px;overflow:hidden}
.w-poll .opt .bar{position:absolute;inset:0 auto 0 0;background:rgba(207,224,255,.12);z-index:0;transition:width .5s}
.w-poll .opt span{position:relative;z-index:1;display:flex;justify-content:space-between;gap:10px}
.w-poll .opt.mine{border-color:var(--accent)}
.w-poll .foot{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:10px}
.w-paywall{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.1em}
.w-paywall::before,.w-paywall::after{content:"";flex:1;height:1px;background:var(--accent);opacity:.5}
.w-embed a{display:flex;justify-content:space-between;gap:14px;align-items:center;border:1px solid var(--line-strong);padding:16px 18px;text-decoration:none !important;background:var(--field)}
.w-embed .et{color:var(--fg);font-weight:500;font-size:16px}
.w-embed .eu{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.gate{border:1px solid var(--line-strong);padding:28px;text-align:center;display:grid;gap:12px;justify-items:center;background:var(--field);margin-top:10px}
.gate h3{font-size:28px}
.gate p{margin:0;color:var(--muted)}
.subcta{margin-top:44px;border:1px solid var(--line);padding:28px;display:grid;gap:12px;text-align:center;justify-items:center}
.subcta h3{font-size:28px}
.subcta .subbox{width:min(420px,100%)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:28px}
.chip{font-family:var(--mono);font-size:11.5px;padding:4px 9px;border:1px solid var(--line);color:var(--muted)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
.pn a{border:1px solid var(--line);padding:16px 18px;text-decoration:none;display:grid;gap:4px;min-width:0}
.pn a:hover{border-color:var(--line-strong)}
.pn .k{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.pn .t{font-family:var(--display);font-size:20px;line-height:1.2}
.pn .nx{text-align:right;grid-column:2}
@media (max-width:560px){.pn{grid-template-columns:minmax(0,1fr)}.pn .nx{grid-column:1;text-align:left}}
.comments{margin-top:46px}
.comments h3{font-size:26px;margin-bottom:16px}
.cform{display:grid;gap:10px;margin-bottom:24px}
.cform textarea{background:var(--field);border:1px solid var(--line);padding:12px 14px;min-height:90px;resize:vertical}
.cform textarea:focus{outline:none;border-color:var(--fg)}
.cform input.cname{background:var(--field);border:1px solid var(--line);padding:11px 14px;max-width:320px}
.cform input.cname:focus{outline:none;border-color:var(--fg)}
.cform .cnote{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.cmt{border-top:1px solid var(--line);padding-block:16px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px}
.cmt .who{font-weight:500;font-size:14px}
.cmt .when{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:8px}
.cmt p{margin:6px 0 0;color:var(--body);white-space:pre-wrap;overflow-wrap:anywhere}
.cmt .acts{margin-top:6px;display:flex;gap:6px}
.owner-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

/* layout edit mode */
.ebar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;background:#0d1020;border:1px solid var(--accent);box-shadow:0 10px 40px rgba(0,0,0,.6);max-width:calc(100vw - 24px);flex-wrap:wrap}
.ebar .t{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.08em;margin-right:6px}
.edit .blk{outline:1px dashed var(--line-strong);outline-offset:8px}
.edit .blk:hover{outline-color:var(--accent)}
.btools{position:absolute;top:-16px;right:0;z-index:5;display:flex;gap:4px;background:#0d1020;border:1px solid var(--line-strong);padding:3px}
.btools button{background:none;border:0;padding:4px 8px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--muted)}
.btools button:hover{color:var(--fg)}
[contenteditable="true"].inl{outline:none;border-bottom:1px dashed transparent;min-width:2em;display:inline-block}
.edit [contenteditable="true"].inl:hover,.edit [contenteditable="true"].inl:focus{border-bottom-color:var(--accent)}
.blk [contenteditable="true"]:focus{outline:none}
.addblk{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:14px;border:1px dashed var(--line-strong);background:var(--glass)}
.addblk .l{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:6px}
.tabedit{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px;border:1px solid var(--line-strong);background:var(--glass-2);margin-top:14px}
.tabedit .l{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.08em}
.tabedit select,.tabedit input{background:var(--raise);border:1px solid var(--line);padding:7px 10px}
.cardtools{position:absolute;top:8px;right:8px;z-index:3;display:flex;gap:4px}
.cardtools button{color:#e9ecf5;background:rgba(5,6,11,.85);border:1px solid var(--line-strong);padding:5px 9px;cursor:pointer;font-family:var(--mono);font-size:12px}

/* ---------- post editor ---------- */
/* gallery strip (Book Reviews) */
.gal{position:relative;min-height:calc(100vh - 90px);display:grid;align-content:center;padding-block:30px 150px}
.gal-vp{overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.gal-vp.drag{cursor:grabbing}
.gal-vp:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
.gal-tr{display:flex;align-items:flex-end;gap:36px;width:max-content;padding-inline:max(28px,7vw);will-change:transform}
.book{flex:none;width:168px;display:grid;gap:10px;text-decoration:none;position:relative;animation:pop .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 110ms)}
.book .bt{font-family:var(--display);font-size:20px;line-height:1.12;color:var(--fg);text-shadow:0 1px 10px rgba(0,0,0,.9);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.book .bt svg{width:13px;height:13px;vertical-align:1px;margin-right:4px;fill:var(--accent)}
.book .bc{display:block;aspect-ratio:2/3;width:100%;background:rgba(255,255,255,.07);overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.book .bc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.book:hover .bc,.book:focus-visible .bc{transform:translateY(-6px);box-shadow:0 14px 30px rgba(0,0,0,.55)}
.book .pinbtn{position:absolute;bottom:6px;left:6px;z-index:2;opacity:0;transition:opacity .2s;color:#e9ecf5;background:rgba(5,6,11,.85);border:1px solid var(--line-strong);font-family:var(--mono);font-size:12px;padding:6px 10px;cursor:pointer}
.book:hover .pinbtn,.book .pinbtn:focus-visible,.book .pinbtn.on{opacity:1}
.book .pinbtn.on{color:var(--accent);border-color:var(--accent)}
.addbook{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:11.5px;text-align:left}
.addbook .bc{display:grid;place-items:center;border:1px dashed var(--line-strong);background:transparent;font-size:34px;font-family:var(--sans)}
.addbook .bt{font-family:var(--mono);font-size:13px;color:var(--muted)}
.addbook:hover .bt,.addbook:hover .bc{color:var(--fg)}
.gal-ft{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-inline:max(28px,7vw);margin-top:26px;font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-shadow:0 1px 8px #000}
.gal-ft .arr{display:flex;gap:8px}
.gal-ft button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(5,6,11,.6);cursor:pointer;font-size:15px}
.gal-ft button:hover{border-color:var(--fg)}
.gal-ft button[disabled]{opacity:.3;cursor:default}
.gal-empty{padding-inline:max(28px,7vw);color:var(--muted);font-family:var(--mono);font-size:12.5px}
.reader{position:fixed;inset:0;z-index:25;background:rgba(2,3,8,.6);overflow-y:auto;padding-top:calc(env(safe-area-inset-top,0px) + 76px);padding-bottom:60px;animation:fadein .35s ease both}
.reader .post{margin-top:0;position:relative;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(30px)}to{transform:none}}
.closex{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;text-decoration:none;font-size:16px;background:var(--glass)}
.closex:hover{border-color:var(--fg)}
.lavatar{width:184px;height:184px;border-radius:50%;object-fit:cover;display:block;animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);filter:grayscale(.1) brightness(.95)}50%{transform:scale(1.03);filter:grayscale(0) brightness(1.05)}}
.pf{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:clamp(18px,4vw,56px);align-items:center;padding-top:10px}
.pf .col{display:grid;gap:22px;min-width:0}
.pf .col.l{justify-items:end;text-align:right}
.aff{display:flex;align-items:center;gap:14px;max-width:280px}
.pf .col.l .aff{flex-direction:row-reverse}
.aff .mg{flex:none;width:52px;height:52px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-family:var(--display);font-size:17px;letter-spacing:.02em;background:var(--glass)}
.aff .nm{font-family:var(--display);font-size:19px;line-height:1.15;color:var(--fg)}
.aff .pl{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);margin-top:3px;text-transform:uppercase}
@media (max-width:760px){.pf{grid-template-columns:minmax(0,1fr)}.pf .col,.pf .col.l{justify-items:start;text-align:left}.pf .col.l .aff{flex-direction:row}.pf .mid{order:-1;justify-self:center}}
.blk-portrait{display:grid;justify-items:center;gap:12px}
.wm-chip{display:grid;place-items:center;width:min(250px,100%);min-height:96px;padding:16px 20px;background:#fff;color:#111;filter:grayscale(1);cursor:crosshair;-webkit-mask-image:radial-gradient(circle 0px at -100px -100px,transparent 99%,#000 100%);mask-image:radial-gradient(circle 0px at -100px -100px,transparent 99%,#000 100%)}
.wm-chip.er{-webkit-mask-image:radial-gradient(circle 46px at var(--mx) var(--my),transparent 0 70%,#000 100%);mask-image:radial-gradient(circle 46px at var(--mx) var(--my),transparent 0 70%,#000 100%)}
.wm-chip img{max-width:100%;max-height:76px;object-fit:contain;display:block;filter:grayscale(1) contrast(1.15)}
.wm{display:grid;justify-items:center;text-align:center;line-height:1;gap:4px}
.wm b,.wm small,.wm i{font-style:normal}
.wm-cal small{font:600 9.5px/1 "Montserrat",sans-serif;letter-spacing:.24em;text-transform:uppercase}
.wm-cal b{font:700 44px/.95 "Crimson Pro",Georgia,serif;letter-spacing:-.01em}
.wm-tec{gap:2px}
.wm-tec b{font:800 46px/.9 "Montserrat",sans-serif;letter-spacing:-.04em;text-transform:lowercase}
.wm-tec small{font:500 13px/1 "Montserrat",sans-serif;letter-spacing:.04em}
.wm-uva i{font:700 13px/1 "Montserrat",sans-serif;letter-spacing:.3em;margin-bottom:4px}
.wm-uva b{font:600 20px/1.05 "Cormorant Garamond",Georgia,serif;letter-spacing:.02em}
.wm-ucsc b{font:700 21px/1.05 "Cormorant Garamond",Georgia,serif;letter-spacing:.06em;text-transform:uppercase}
.wm-ucsc small{font:500 15px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.14em;text-transform:uppercase}
.wm-gen b{font:600 22px/1.1 "Cormorant Garamond",Georgia,serif}
.aff{flex-direction:column;align-items:center;gap:8px}
.pf .col.l .aff{flex-direction:column}
.blk-portrait canvas{width:min(280px,100%);max-width:100%;aspect-ratio:460/693;display:block;touch-action:none;cursor:grab}
.blk-portrait canvas.down{cursor:grabbing}
.blk-portrait .hint{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.08em}
.tabedit label.ck{display:inline-flex;gap:6px;align-items:center;font-size:13px}
#editor{position:fixed;inset:0;z-index:40;background:var(--page);color:var(--fg);overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.etop{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;background:var(--ebar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.etop .st{font-family:var(--mono);font-size:12px;color:var(--muted)}
.etop .r{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tbar{position:sticky;top:var(--etop,58px);z-index:3;display:flex;gap:2px;flex-wrap:wrap;align-items:center;padding-block:6px;background:var(--ebar);border-bottom:1px solid var(--line)}
.tbar button,.tbar select{background:none;border:1px solid transparent;color:var(--body);min-width:34px;height:34px;padding:0 8px;cursor:pointer;font-size:14px}
.tbar select{border-color:var(--line);background:var(--raise);font-family:var(--mono);font-size:12px}
.tbar button:hover{background:var(--raise)}
.tbar button.on{border-color:var(--line-strong);background:var(--raise);color:var(--fg)}
.tbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.tbar .tx{font-family:var(--mono);font-size:12px}
.ecol{max-width:740px;margin:0 auto;padding-block:36px 140px}
.ecol .ttl{font-family:var(--display);font-size:clamp(36px,6vw,52px);line-height:1.08;outline:none;min-height:1.1em}
.ecol .stl{font-family:var(--read);font-size:21px;color:var(--muted);outline:none;margin:12px 0 26px;min-height:1.4em}
[data-ph]:empty::before{content:attr(data-ph);color:var(--dim)}
#ed{outline:none;min-height:50vh}
#ed p:empty::before{content:""}
#ed .w-btn,#ed .w-poll,#ed .w-embed,#ed .w-paywall,#ed figure{cursor:pointer}
#ed .w-btn:hover,#ed .w-poll:hover,#ed .w-embed:hover,#ed figure:hover{outline:1px dashed var(--accent);outline-offset:6px}
.wc{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.drawer{position:fixed;z-index:45;top:0;right:0;bottom:0;width:min(420px,100vw);background:#0a0c16;border-left:1px solid var(--line-strong);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) max(22px,env(safe-area-inset-right,0px)) 40px 22px;box-shadow:-20px 0 60px rgba(0,0,0,.6)}
.drawer h3{font-size:28px;margin-bottom:18px}
.f{display:grid;gap:7px;margin-bottom:16px}
.f > label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.f input[type=text],.f input[type=email],.f input[type=url],.f input[type=datetime-local],.f input[type=date],.f textarea,.f select{width:100%;background:var(--raise);border:1px solid var(--line);padding:10px 12px;border-radius:0}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--fg)}
.f textarea{min-height:80px;resize:vertical}
.f .h{font-size:12px;color:var(--dim)}
.f .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line)}
.seg label{flex:1;text-align:center;padding:8px;cursor:pointer;font-size:13px;border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked + span{color:var(--onfg)}
.seg label:has(input:checked){background:var(--fg);color:var(--onfg)}
.thumbprev{width:96px;aspect-ratio:1;object-fit:cover;border:1px solid var(--line)}
.seo{border:1px solid var(--line);padding:14px;display:grid;gap:4px;background:#fff;color:#1a1a1a;font-family:Arial,sans-serif}
.seo .u{font-size:12px;color:#4d5156}.seo .t{font-size:17px;color:#1a0dab}.seo .d{font-size:13px;color:#4d5156}
.preview-wrap{position:fixed;inset:0;z-index:46;overflow-y:auto;padding-block:20px 60px}
.preview-wrap .pvbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:3;margin:0 auto;width:max-content;max-width:calc(100vw - 24px);display:flex;gap:8px;align-items:center;background:#0d1020;border:1px solid var(--accent);padding:6px 6px 6px 14px;font-family:var(--mono);font-size:12px;color:var(--accent)}

/* dialog */
#dlg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.dbox{width:min(480px,100%);max-height:88vh;overflow-y:auto;background:#0b0d18;border:1px solid var(--line-strong);padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.dbox h3{font-size:26px;margin-bottom:16px}
.dbox .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.dbox .acts .grow{margin-right:auto}
.list{display:grid;gap:0;border-top:1px solid var(--line);margin-bottom:14px}
.list .it{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.list .it .m{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.list .it span:first-child{min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);background:#141828;border:1px solid var(--line-strong);padding:11px 16px;font-family:var(--mono);font-size:12.5px;max-width:calc(100vw - 32px)}
/* Substack "paper" scheme: pale periwinkle + slate ink, used by posts, the editor and the light tabs */
.paper{--pbgx:var(--pbg,#eef2ff);--pinkx:var(--pink,#36405d);
 --fg:var(--pinkx);--body:color-mix(in srgb,var(--pinkx) 90%,var(--pbgx));--muted:color-mix(in srgb,var(--pinkx) 62%,var(--pbgx));--dim:color-mix(in srgb,var(--pinkx) 42%,var(--pbgx));
 --line:color-mix(in srgb,var(--pinkx) 15%,transparent);--line-strong:color-mix(in srgb,var(--pinkx) 34%,transparent);
 --glass:color-mix(in srgb,#ffffff 50%,var(--pbgx));--glass-2:var(--pbgx);--raise:color-mix(in srgb,var(--pinkx) 8%,var(--pbgx));
 --accent:#ff6719;--danger:#c2412d;--ok:#1f8a4c;--onfg:var(--pbgx);--page:var(--pbgx);--codebg:color-mix(in srgb,var(--pinkx) 6%,var(--pbgx));
 --ebar:color-mix(in srgb,var(--pbgx) 94%,transparent);--field:color-mix(in srgb,#ffffff 55%,var(--pbgx));--navbg:color-mix(in srgb,var(--pbgx) 86%,transparent);
 color:var(--fg);color-scheme:light}
.post.paper{backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.paper .tabhead h1,.paper .tabhead .tl,.paper .book .bt,.paper .gal-ft{text-shadow:none}
.paper .book .bc{background:var(--raise)}
.paper .gal-ft button{background:var(--glass)}
.paper .blk-portrait canvas{background:radial-gradient(circle at 50% 32%,#161c33,#05060b 78%);border-radius:6px}
.paper .prose .tc-orange{color:#e8590c}.paper .prose .tc-red{color:#c92a2a}.paper .prose .tc-green{color:#2b8a3e}.paper .prose .tc-blue{color:#1c5bc4}.paper .prose .tc-purple{color:#7048c0}.paper .prose .tc-grey{color:#808287}
.prose .tc-orange{color:#ff8a4c}.prose .tc-red{color:#ff8787}.prose .tc-green{color:#8ce99a}.prose .tc-blue{color:#91b4ff}.prose .tc-purple{color:#c6a8ff}.prose .tc-grey{color:#a5a8b0}
.ebar,.pvbar{--fg:#f3f4f8;--muted:#9a9fb3;--line-strong:rgba(220,228,255,.34);--onfg:#05060b;--accent:#cfe0ff;color:#f3f4f8}
.btools{--muted:#9a9fb3;--fg:#f3f4f8}
.nav .brand{display:inline-flex;align-items:center;gap:10px}

.edtoggle{position:fixed;z-index:30;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:#0d1020;color:#e9ecf5;border:1px solid rgba(220,228,255,.34);border-radius:999px;padding:10px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}

.edtoggle.on{background:#ff6719;border-color:#ff6719;color:#fff}

.book:hover .btools2,.trip:hover .btools2,.btools2:focus-within,.btools2:has(.on){opacity:1}
/* awards grid (Trips), modeled on wodniack.dev's Awards section, in orange */
.aw-sec{--o:#ff6719;--d:#1c0800;position:relative;overflow:hidden;background:var(--o);color:var(--d);margin-top:16px;padding-block:clamp(90px,12vw,170px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.aw-grid{position:absolute;inset:0;pointer-events:none;overflow:visible}
.aw-grid path{fill:none;stroke:var(--d);stroke-width:1;vector-effect:non-scaling-stroke}
.aw-inner{position:relative;z-index:1;width:min(860px,100%);margin:0 auto;background:var(--o);container-type:inline-size;will-change:transform}
.aw-title{margin:0;padding:0 0 2px;background:var(--d);color:var(--o);font:500 12px/24px var(--mono);letter-spacing:.1em;text-align:center;text-transform:uppercase}
.aw-list{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(var(--rows,4),calc(100cqw / 4 / .751));background:repeating-linear-gradient(-45deg,transparent,transparent 1px,var(--d) 1.5px,var(--d) 2.5px,transparent 3px,var(--o) 11px);overflow:hidden}
.aw{position:relative;z-index:2;margin:0;padding:.75rem;background:var(--o);clip-path:inset(-1px);min-width:0;will-change:transform}

<script type="application/json" id="site-data">{"site": {"title": "Gabriel Horowitz", "tagline": "Book reviews, projects and cool stuff, written under a big sky.", "author": "Gabriel Horowitz", "accent": "#cfe0ff", "font": "night", "loader": {"on": true, "eyebrow": "Welcome to", "sub": "Book reviews, projects and cool stuff. Subscribe to get new posts.", "image": "/_blob/1e7c154bdfda261a754a81acb02a4c85"}, "paper": {"bg": "#eef2ff", "ink": "#36405d"}, "timezone": "America/Los_Angeles"}, "tabs": [{"id": "t1", "name": "Book Reviews", "slug": "book-reviews", "cols": 3, "sort": "date", "blocks": [], "layout": "gallery", "showTitle": false, "bg": {"type": "image", "image": "/_blob/a57f5d57f6c3b3e02493f6e80ab2b717", "dim": 0, "grass": false, "meteors": true}}, {"id": "t2", "name": "Projects", "slug": "projects", "cols": 2, "sort": "date", "blocks": [{"id": "b2", "type": "text", "html": "Things I'm building, with notes on what worked and what didn't."}], "layout": "grid", "showTitle": true, "bg": {"type": "paper", "image": "", "dim": 0.45, "grass": true}}, {"id": "t3", "name": "Gabriel", "slug": "gabriel", "cols": 3, "sort": "date", "blocks": [{"id": "bp", "type": "portrait", "aff": "UC Berkeley | Berkeley, California\nTecnológico de Monterrey | Monterrey, Mexico\nUniversity of Amsterdam | Amsterdam, Netherlands\nUniversità Cattolica del Sacro Cuore | Milan, Italy"}], "layout": "grid", "showTitle": true, "bg": {"type": "plain", "image": "", "dim": 0.45, "grass": true}, "title": "Gabriel Horowitz Rossi"}, {"id": "t4", "name": "Cool Stuff", "slug": "cool-stuff", "cols": 4, "sort": "date", "blocks": [{"id": "bw", "type": "silhouette", "caption": "David Bowie"}], "layout": "gallery", "showTitle": true, "bg": {"type": "paper", "image": "", "dim": 0.45, "grass": true}, "cursor": "shadow"}, {"id": "t5", "name": "Trips", "slug": "trips", "cols": 3, "sort": "date", "blocks": [], "layout": "awards", "showTitle": false, "bg": {"type": "orange", "image": "", "dim": 0.45, "grass": true}}], "posts": [{"audience": "everyone", "author": "", "comments": "everyone", "cover": "/_blob/b82a20bc0b29c4fa608c1240f2403eb8", "date": "2026-10-07T16:06", "html": "\u003cfigure class=\"w-img\" data-w=\"55\">\u003cimg src=\"/_blob/f3b9098a8aee3c90eb775e2ee6ec034f\" alt=\"\">\u003cfigcaption>Add a caption\u003c/figcaption>\u003c/figure>\u003cp>\u003cbr>\u003c/p>\u003cp>Jennifer Egan is one of the most talented writers alive, that much is clear (and I'd be hard-pressed to find better). \u003cem>A Visit From the Goon Squad (2010)\u003c/em> was a revelation of meta-modernism (and sincerity!) that deserves its own eventual post.\u003c/p>\u003cp>The semi-sequel to \u003cem>Goon Squad\u003c/em>, with many characters returning, is Candy House, one of my favorite works I've read in the last few years.\u003cbr>\u003cbr>The scope is just extraordinary.\u003c/p>\u003cp>It’s main premise introduces a new piece of tech from a company called ‘Mandala’ which allows users to upload the entirety of their memories. It whips back and forth through decades, with academics, spies, gamers, artists, and kids serving as Egan's guinea pigs through a technological stampede. Every story is interconnected, a point that makes the novel quite hard to describe. The novel sweeps you away, and while you may not always keep track of every character, it's too finely written and engaging for it to really matter.\u003c/p>\u003cp>\u003cem>Side Note\u003c/em>: To say it is foreboding does not do justice to the novel’s sense of timing!\u003c/p>\u003cblockquote>\u003cp>\u003cem>Side Side Note:\u003cbr>Candy House\u003c/em> was written before the release of GPT-3.5, which makes it all the more impressive how prescient Egan is at describing these fictional automations.\u003c/p>\u003cp>It quite literally features a character who dilutes scenes from stories down into \"stockblocks” and algebraic expressions, and another who struggles to express and understand love through quantifiable information. Sound familiar?\u003c/p>\u003cp>The novel demonstrates themes of hyperreality and the eroding boundaries between artificial records and our collective privacy, recognizing the overbearing and unmistakable way big data is swarming every corner of our society.\u003c/p>\u003cp>\u003cem>“All this thinking melded and when ChatGPT came along, it felt like the real world embodiment of a lot of these ideas I’d been thinking about.” - Egan\u003c/em>\u003c/p>\u003cp>We are at war with human identity and subjective thinking, and while this is worth another post in another time, some regrets felt by Mandala’s CEO in this novel may also prove prescient in years to come.\u003c/p>\u003c/blockquote>\u003cp>The NYT described this book as \u003cem>\u003cspan class=\"tc-red\">“\u003ca href=\"https://www.nytimes.com/2022/04/06/books/review/jennifer-egan-the-candy-house.html\">a social network, the literary version of the collaborative novel written by your friends and friends of friends on Facebook or Instagram, each link opening on a new protagonist. It is a spectacular palace built out of rabbit holes.”\u003c/a>\u003c/span>\u003c/em>\u003c/p>\u003cp>Egan’s main focus, I believe\u003cspan>, is on social and familial relationships within these imagined technological parameters. It is incredibly emotional, illuminating personal dynamics in a profound and relatable way (how memories control, invite, and compress us).\u003c/span>\u003c/p>\u003cp>It presents paradigm-shifting technologies with nuance, rocking back and forth but ultimately maintaining focus on the human condition. The very core of Egan's work, in my opinion, is on how human beings deal with one another. Jennifer Egan is as witty as always, and the way her characters interact with each other is just so much fun. You don't neeeeed to read \u003cem>A Visit from the Goon Squad\u003c/em> (still recognized as her most famous …. and pulitzer prize winning… novel) before Candy House, but it does enhance the experience.\u003c/p>\u003cp>The sentimentality surprised me, but it is exactly what the book required.\u003c/p>\u003cp>Egan goes for it and deals with humanity at its very core. The dangers of modern technologies….social media… individuality…dopamine…the very basis of human authenticity; it's all there.\u003c/p>\u003cp>Its ending absolutely demolished me as well. I keep thinking about it...\u003cbr>Anyways, do yourself a treat and absorb it.\u003c/p>\u003cp>Candy Man out.\u003c/p>\u003cdiv class=\"w-btn\" data-kind=\"subscribe\" data-label=\"Subscribe\">\u003c/div>", "id": "sub-candy-house", "isNew": false, "order": 0, "pinned": false, "seoDesc": "", "seoTitle": "", "slug": "the-candy-house-jennifer-egan", "subtitle": "The Candy Man presents", "tabId": "t1", "tags": ["books"], "title": "The Candy House", "updatedAt": 1792440262883, "at": 1791414360000, "notify": false}, {"author": "", "tags": [], "audience": "everyone", "comments": "everyone", "seoTitle": "", "seoDesc": "", "order": 0, "pinned": true, "id": "sub-welcome", "tabId": "t1", "slug": "welcome-to-the-candy-man", "title": "Welcome to THECANDYMAN", "subtitle": "", "date": "2025-07-17T21:14", "cover": "/_blob/9d630df83764818762ae56b30b3837d0", "html": "\u003cp>This is GH’s Substack (wanted something better than substack).\u003c/p>\u003cp>Mainly for book reviews.\u003c/p>\u003cp>Maybe some music stuff too.\u003c/p>\u003cp>Maybe some film stuff too.\u003c/p>\u003cp>Probably some political stuff too.\u003c/p>\u003cp>Enjoy?\u003c/p>\u003cblockquote class=\"pull\">\u003cp>\u003cem>Note:\u003c/em>\u003c/p>\u003cp>\u003cem>The Candy Man refers to Sammy Davis Jr’s iconic single, featured in Madagascar (2005).\u003c/em>\u003c/p>\u003cp>\u003cem>It is not a euphemism nor does it carry any other negative connotations.\u003c/em>\u003c/p>\u003c/blockquote>\u003cfigure class=\"w-img\">\u003cimg src=\"/_blob/9d630df83764818762ae56b30b3837d0\" alt=\"Gabriel sitting in a giant red chair on a sidewalk\">\u003cfigcaption>2022, San Diego. Picture taken by an Argentine.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"w-btn\" data-kind=\"subscribe\" data-label=\"Subscribe now\">\u003c/div>", "at": 1752812040000, "notify": false}, {"id": "p4", "tabId": "t2", "slug": "launch-screen", "title": "A loading screen with a rocket", "subtitle": "How this site's intro works.", "date": "2026-10-18T20:00", "author": "", "cover": "", "tags": ["web"], "audience": "everyone", "comments": "everyone", "seoTitle": "", "seoDesc": "", "order": 0, "example": true, "html": "\u003cp>\u003cem>Example project post.\u003c/em>\u003c/p>\u003cp>The intro counts to 100, swaps the progress bar for a launch button, and sends a rocket up through the sky before the site opens.\u003c/p>\u003cdiv class=\"w-btn\" data-kind=\"subscribe\" data-label=\"Subscribe for the next build log\">\u003c/div>", "pinned": false, "at": 1792378800000, "notify": false}, {"id": "p5", "tabId": "t4", "slug": "five-things", "title": "Five things I found this week", "subtitle": "Links, tools and one very good sandwich.", "date": "2026-10-16T18:00", "author": "", "cover": "", "tags": ["links"], "audience": "everyone", "comments": "everyone", "seoTitle": "", "seoDesc": "", "order": 0, "example": true, "html": "\u003cp>\u003cem>Example post.\u003c/em>\u003c/p>\u003col>\u003cli>A tool I'd recommend.\u003c/li>\u003cli>An essay worth your time.\u003c/li>\u003cli>A song on repeat.\u003c/li>\u003cli>A place on campus nobody goes.\u003c/li>\u003cli>The sandwich.\u003c/li>\u003c/ol>\u003cdiv class=\"w-embed\" data-href=\"https://enactusberkeley.com\" data-title=\"enactus Berkeley\">\u003c/div>", "pinned": false, "at": 1792198800000, "notify": false}, {"author": "", "tags": ["travel"], "audience": "everyone", "comments": "everyone", "seoTitle": "", "seoDesc": "", "order": 0, "pinned": false, "cover": "", "example": true, "tabId": "t5", "id": "trip-amsterdam", "slug": "amsterdam-trip", "title": "Amsterdam", "subtitle": "Canals, bikes and a semester abroad", "date": "2026-02-14T10:00", "html": "\u003cp>\u003cem>Example trip. Open it with Edit site on, then Edit post to write about Amsterdam and add photos, or delete it.\u003c/em>\u003c/p>\u003cp>Where I stayed, what I ate, what I'd do again.\u003c/p>", "tile": {"kind": "big", "scale": 95}, "at": 1771092000000, "notify": false}, {"author": "", "tags": ["travel"], "audience": "everyone", "comments": "everyone", "seoTitle": "", "seoDesc": "", "order": 0, "pinned": false, "cover": "", "example": true, "tabId": "t5", "id": "trip-milan", "slug": "milan-trip", "title": "Milan", "subtitle": "Duomo rooftops and too much risotto", "date": "2025-11-02T10:00", "html": "\u003cp>\u003cem>Example trip. Open it with Edit site on, then Edit post to write about Milan and add photos, or delete it.\u003c/em>\u003c/p>\u003cp>Where I stayed, what I ate, what I'd do again.\u003c/p>", "at": 1762106400000, "notify": false}, {"author": "", "tags": ["travel"], "audience": "everyone", "comments": "everyone", "seoTitle": "", "seoDesc": "", "order": 0, "pinned": false, "cover": "", "example": true, "tabId": "t5", "id": "trip-monterrey", "slug": "monterrey-trip", "title": "Monterrey", "subtitle": "Mountains on every horizon", "date": "2025-06-20T10:00", "html": "\u003cp>\u003cem>Example trip. Open it with Edit site on, then Edit post to write about Monterrey and add photos, or delete it.\u003c/em>\u003c/p>\u003cp>Where I stayed, what I ate, what I'd do again.\u003c/p>", "at": 1750438800000, "notify": false}, {"id": "pmvh5rixe3oql", "tabId": "t5", "slug": "momo", "title": "MOMO", "subtitle": "nn", "date": "2026-10-20T13:51", "author": "", "cover": "", "tags": [], "audience": "everyone", "comments": "everyone", "seoTitle": "", "seoDesc": "", "html": "\u003cp>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>jjjj\u003c/p>", "order": 999, "at": 1792529460000, "notify": false}]}</script>

async function upload(file){if(!C.canEdit){toast("Click Edit and sign in first.");return null;}if(!file)return null;
  if(file.size>10*1024*1024){toast("That file is over 10 MB.",4000);return null;}toast("Uploading "+file.name+"…",0);
  try{const r=await api("POST","/api/upload",undefined,file);toast("Uploaded");return r.url;}
  catch(e){toast(e.status===415?"Only PNG, JPEG, GIF, WebP or AVIF images.":(e.message||"Upload failed. Try again."),4000);return null;}}

/* ---------- publish whole page ---------- */
let busy=false;
async function publishState(next,msg){
  if(!C.canEdit){toast("Click Edit and sign in first.",4000);return false;}if(busy)return false;busy=true;toast(msg||"Publishing…",0);
  try{
    const r=await api("PUT","/api/site",{site:next,baseVersion:C.version});
    C.version=r.version;
    Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,r.site);
    L=null;bgKey="";busy=false;
    if(E)closeEditor();else render();
    toast("Published",2500);return true;
  }catch(e){busy=false;
    if(e.status===409){toast("A newer version was saved elsewhere. Reloading.",3000);setTimeout(()=>location.reload(),1500);}
    else if(e.status===401){C.canEdit=false;render();toast("Your session ended. Click Edit and sign in again.",5000);}
    else toast(e.message||"Couldn't publish. Try again in a moment.",5000);
    return false;}
}

  try{await api("PUT","/api/drafts",{id:E.post.id,data:d});const i=cache.drafts.findIndex(x=>x.id===d.id);if(i>=0)cache.drafts[i]=d;else cache.drafts.push(d);setSt("Draft saved");}
  catch(_){setSt("Couldn't save draft");}}
async function deleteDraft(id){try{await api("DELETE","/api/drafts?id="+encodeURIComponent(id));}catch(_){}cache.drafts=cache.drafts.filter(d=>d.id!==id);}

let savedRange=null;
function saveSel(){const s=getSelection();if(s.rangeCount&&$("#ed").contains(s.anchorNode))savedRange=s.getRangeAt(0).cloneRange();}
function restoreSel(){const ed=$("#ed");ed.focus();if(savedRange){const s=getSelection();s.removeAllRanges();s.addRange(savedRange);}}
function insertHTML(h){restoreSel();document.execCommand("insertHTML",false,h);hydrate($("#ed"),"edit");scheduleSave();updWC();}
function blockAncestor(n){const ed=$("#ed");while(n&&n!==ed){if(n.nodeType===1&&/^(P|H2|H3|H4|PRE|BLOCKQUOTE|LI)$/.test(n.tagName))return n;n=n.parentNode;}return null;}
function syncTB(){if(!E)return;["bold","italic","strikeThrough","insertUnorderedList","insertOrderedList"].forEach(c=>{const b=$(`#tbar [data-c="${c}"]`);let on=false;try{on=document.queryCommandState(c);}catch(_){}b&&b.classList.toggle("on",on);});
  const s=getSelection();const blk=s.rangeCount&&blockAncestor(s.anchorNode);const sel=$("#e-style");if(sel){const t=blk?blk.tagName.toLowerCase():"p";sel.value=["h2","h3","h4","pre"].includes(t)?t:"p";}}
document.addEventListener("selectionchange",()=>{if(E&&$("#ed")&&$("#ed").contains(getSelection().anchorNode)){saveSel();syncTB();}});
async function tbCmd(c,val){

  if(c==="style"){restoreSel();document.execCommand("formatBlock",false,"<"+val+">");scheduleSave();return;}
  if(c==="quote"||c==="pull"){restoreSel();const s=getSelection();const blk=blockAncestor(s.anchorNode);if(blk&&blk.tagName==="BLOCKQUOTE"&&(c==="quote"?!blk.classList.contains("pull"):blk.classList.contains("pull"))){document.execCommand("formatBlock",false,"<p>");}else{document.execCommand("formatBlock",false,"<blockquote>");const b2=blockAncestor(getSelection().anchorNode);if(b2&&b2.tagName==="BLOCKQUOTE")b2.classList.toggle("pull",c==="pull");}scheduleSave();return;}
  if(c==="code"){restoreSel();const t=getSelection().toString();if(!t){toast("Select some text first.");return;}document.execCommand("insertHTML",false,`<code>${esc(t)}</code>&#8203;`);scheduleSave();return;}
  if(c==="hr"){insertHTML("<hr><p><br></p>");return;}
  if(c==="color"){saveSel();if(!savedRange||savedRange.collapsed){toast("Select some text first.");return;}
    const ink=hexOk(E.post.ink)||sitePaper().ink;
    const d=dialog({title:"Text color",ok:null,extra:`<div class="swatches"><button type="button" class="sw" data-tc="${ink}" style="--c:${ink}"><i></i>Default</button>${TC.map(t=>`<button type="button" class="sw" data-tc="${t[1]}" style="--c:${t[1]}"><i></i>${t[2]}</button>`).join("")}</div><p class="h" style="font-size:12.5px;color:var(--dim);margin:0 0 10px">To change the whole post's text color, open Settings → Post colors.</p>`});
    d.root.addEventListener("click",ev=>{const b=ev.target.closest("[data-tc]");if(!b)return;d.close();restoreSel();try{document.execCommand("styleWithCSS",false,false);}catch(_){}document.execCommand("foreColor",false,b.dataset.tc);scheduleSave();});return;}
  if(c==="link"){saveSel();const cur=savedRange&&savedRange.startContainer.parentElement&&savedRange.startContainer.parentElement.closest("a");
    dialog({title:cur?"Edit link":"Add link",fields:[{k:"url",l:"URL",t:"url",v:cur?cur.getAttribute("href"):"",ph:"https://…"},{k:"text",l:"Text (if nothing is selected)",v:"",ph:"Link text"}],danger:cur?"Remove link":null,ok:"Apply",
     onOk:v=>{const u=safeUrl(v.url)||(v.url&&safeUrl("https://"+v.url.replace(/^\/+/,"")));if(!u)return "Enter a full web address.";restoreSel();const s=getSelection();if(s.isCollapsed){document.execCommand("insertHTML",false,`<a href="${esc(u)}">${esc(v.text||u)}</a>&nbsp;`);}else document.execCommand("createLink",false,u);scheduleSave();},
     onDanger:()=>{restoreSel();const s=getSelection();if(cur){const r=document.createRange();r.selectNodeContents(cur);s.removeAllRanges();s.addRange(r);}document.execCommand("unlink");scheduleSave();}});return;}
  if(c==="image"){saveSel();const [f]=await pickFiles("image/*");const u=await upload(f);if(u)insertHTML(`<figure class="w-img"><img src="${esc(u)}" alt=""><figcaption>Add a caption</figcaption></figure><p><br></p>`);return;}
  if(c==="gallery"){saveSel();const fs=await pickFiles("image/*",true);if(!fs.length)return;const us=[];for(const f of fs.slice(0,12)){const u=await upload(f);if(u)us.push(u);}if(us.length)insertHTML(`<figure class="w-gallery">${us.map(u=>`<img src="${esc(u)}" alt="">`).join("")}</figure><p><br></p>`);return;}
  if(c==="video"){saveSel();const [f]=await pickFiles("video/*");const u=await upload(f);if(u)insertHTML(`<figure class="w-video"><video src="${esc(u)}" controls></video><figcaption></figcaption></figure><p><br></p>`);return;}
  if(c==="button"){saveSel();widgetDialog(null,"btn");return;}
  if(c==="poll"){saveSel();widgetDialog(null,"poll");return;}
  if(c==="embed"){saveSel();widgetDialog(null,"embed");return;}
  if(c==="footnote"){saveSel();dialog({title:"Add footnote",fields:[{k:"t",l:"Footnote text",t:"textarea",v:""}],ok:"Insert",onOk:v=>{if(!v.t.trim())return "Write the footnote first.";insertHTML(`<sup class="fn" data-fn="${esc(v.t.trim())}">*</sup>&#8203;`);}});return;}
  if(c==="paywall"){if($("#ed .w-paywall")){toast("This post already has a paywall break.");return;}insertHTML(`<div class="w-paywall"></div><p><br></p>`);toast("Everything below the line is for subscribers.");return;}
}
function widgetDialog(el,kind){
  const d=el?el.dataset:{};
  const F=kind==="btn"?[{k:"kind",l:"Button type",t:"select",o:[["subscribe","Subscribe"],["custom","Custom link"]],v:d.kind||"subscribe"},{k:"label",l:"Label",v:d.label||"",ph:"Subscribe now"},{k:"href",l:"Link (custom buttons)",t:"url",v:d.href||"",ph:"https://…"}]
   :kind==="poll"?[{k:"q",l:"Question",v:d.q||""},{k:"opts",l:"Options, one per line",t:"textarea",v:(d.opts||"").split("|").join("\n")}]
   :[{k:"href",l:"URL",t:"url",v:d.href||"",ph:"https://…"},{k:"title",l:"Title",v:d.title||""}];
  dialog({title:(el?"Edit ":"Add ")+(kind==="btn"?"button":kind==="poll"?"poll":"link card"),fields:F,danger:el?"Remove":null,ok:el?"Save":"Insert",
   onOk:v=>{let attrs;
     if(kind==="btn"){if(v.kind==="custom"&&!safeUrl(v.href))return "Custom buttons need a full link.";attrs={kind:v.kind,label:v.label,href:v.kind==="custom"?safeUrl(v.href):""};}
     else if(kind==="poll"){const o=v.opts.split("\n").map(s=>s.trim().replace(/\|/g,"/")).filter(Boolean);if(!v.q.trim())return "Add a question.";if(o.length<2)return "Add at least two options.";attrs={q:v.q.trim(),opts:o.slice(0,8).join("|"),id:d.id||uid("poll-")};}
     else{const u=safeUrl(v.href);if(!/^https?:/.test(u))return "Enter a full web address.";attrs={href:u,title:v.title};}
     if(el){Object.entries(attrs).forEach(([k,x])=>el.dataset[k]=x);hydrate($("#ed"),"edit");scheduleSave();}
     else{insertHTML(`<div class="w-${kind}" ${Object.entries(attrs).map(([k,x])=>`data-${k}="${esc(x)}"`).join(" ")}></div><p><br></p>`);}},
   onDanger:()=>{el.remove();scheduleSave();}});
}
function figureDialog(fig){const img=$("img",fig);const gal=fig.classList.contains("w-gallery");const w0=fig.dataset.w||"100",a0=fig.dataset.al||"center",m0=fig.dataset.mode||"inline",x0=fig.dataset.x,y0=fig.dataset.y;let prev=m0;
  const F=[{k:"mode",l:"Layout",t:"select",o:[["inline","In line with text"],["wrap","Wrap text"],["behind","Behind text"],["front","In front of text"]],v:m0,h:"Behind text and In front of text let you drag the image anywhere in the post. Behind-text images show faded here so you can grab them."},{k:"w",l:"Width (%)",t:"range",min:10,max:100,step:5,v:w0,h:"You can also drag the orange dot at the image's corner."},{k:"al",l:"Side (in line and wrap text)",t:"select",o:[["center","Center"],["left","Left"],["right","Right"]],v:a0}];

   onOk:v=>{live();if(img&&!gal)img.setAttribute("alt",v.alt);fitFree($("#ed"));scheduleSave();},onDanger:()=>{fig.remove();fitFree($("#ed"));scheduleSave();}});
  function live(){const mEl=$("#dlg-mode");if(!mEl)return;const nm=mEl.value,free=x=>x==="front"||x==="behind";
    if(free(nm)&&!free(prev)){const ed=$("#ed");fig.dataset.x=String(Math.round(fig.offsetLeft/ed.clientWidth*1000)/10);fig.dataset.y=String(Math.round(fig.offsetTop));}
    prev=nm;if(nm==="inline")delete fig.dataset.mode;else fig.dataset.mode=nm;fig.dataset.w=$("#dlg-w").value;fig.dataset.al=$("#dlg-al").value;sizeFig(fig);fitFree($("#ed"));}

function previewPost(){readEditor();const p=E.post;const wrap=document.createElement("div");wrap.className="preview-wrap";
  wrap.innerHTML=`<div class="pvbar">PREVIEW · as readers will see it <button class="btn xs" data-pv="close">Back to editing</button></div>${postView({...p,date:p.date||new Date().toISOString().slice(0,16)},true)}`;

function publishPost(){
  readEditor();const p=E.post;
  if(!p.title)return toast("Add a title before publishing.",3500);
  if(!words(p.html)&&!/<(img|video)/.test(p.html))return toast("Write something before publishing.",3500);
  const when=p.date?new Date(p.date):null;const future=when&&when.getTime()>Date.now();const tname=(S.tabs.find(t=>t.id===p.tabId)||{}).name;
  dialog({title:E.isNew?(future?"Schedule post":"Publish post"):"Update post",ok:future?"Schedule":(E.isNew?"Publish now":"Update now"),
   extra:`<p style="color:var(--body);margin:0 0 14px">“${esc(p.title)}” ${future?`will appear in <b>${esc(tname)}</b> on ${esc(when.toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"}))}.`:`goes live in <b>${esc(tname)}</b>.`}</p>${E.isNew?`<label style="display:flex;gap:10px;align-items:flex-start;color:var(--body);font-size:14.5px;margin:0 0 14px;cursor:pointer"><input type="checkbox" id="pub-notify" ${p.notify===false?"":"checked"} style="margin-top:5px"><span>Email this post to ${confirmedCount()} confirmed subscriber${confirmedCount()===1?"":"s"} when it goes live</span></label>`:`<p class="h" style="color:var(--dim);font-size:12.5px;margin:0 0 14px">Subscribers were emailed when this post first went live. Updating it doesn't email anyone again.</p>`}</p>`,
   onOk:()=>{const c=$("#pub-notify");if(c)E.post.notify=c.checked;doPublishPost();}});
}
async function doPublishPost(){
  const p=clone(E.post);if(!p.date)p.date=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);p.at=new Date(p.date).getTime();
  const next=clone(S);p.slug=uniqueSlug(p.slug||slugify(p.title),next.posts,p.id);
  const i=next.posts.findIndex(x=>x.id===p.id);if(i>=0)next.posts[i]=p;else{const tab=next.tabs.find(t=>t.id===p.tabId);p.order=tab&&tab.sort==="manual"?-1:999;next.posts.push(p);}
  await deleteDraft(p.id);location.hash="p-"+p.slug;
  const ok=await publishState(next,"Publishing post…");if(!ok)saveDraft();
}

  if(e.target.classList&&e.target.classList.contains("reader")){location.hash="t-"+curTab().slug;return;}
  const fa=e.target.closest('a[href^="#fn-"]');if(fa&&!e.target.closest("#editor-root")){e.preventDefault();const t=document.getElementById(fa.getAttribute("href").slice(1));t&&t.scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"});return;}
  if(e.target.closest("#editor-root,#dlg-root,.drawer"))return;
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;if(!a)return;
  if(a==="new-post"){e.preventDefault();openEditor(newPost(b.dataset.tab),true);}
  else if(a==="edit-post"){const p=S.posts.find(x=>x.id===b.dataset.id);const dr=cache.drafts.find(d=>d.id===p.id);if(dr){dialog({title:"Unpublished changes",extra:`<p style="color:var(--body);margin:0 0 14px">You have a saved draft of changes to this post from ${esc(new Date(dr.updatedAt).toLocaleString())}.</p>`,ok:"Continue the draft",danger:"Start from published",onOk:()=>openEditor(dr,false),onDanger:()=>{deleteDraft(p.id);openEditor(p,false);}});}else openEditor(p,false);}
  else if(a==="ask-del"){b.parentElement.innerHTML=`<span class="mono" style="font-size:12px;color:var(--danger)">Delete permanently?</span> <button class="btn sm danger" data-act="del-post" data-id="${esc(b.dataset.id)}">Yes, delete</button> <button class="btn sm ghost" data-act="keep">Keep</button>`;}
  else if(a==="keep")render();
  else if(a==="del-post"){const next=clone(S);const p=next.posts.find(x=>x.id===b.dataset.id);next.posts=next.posts.filter(x=>x.id!==b.dataset.id);const t=next.tabs.find(x=>x.id===(p&&p.tabId));location.hash="t-"+(t?t.slug:next.tabs[0].slug);publishState(next,"Deleting…");}
  else if(a==="drafts")showDrafts();
  else if(a==="bg-edit")bgDialog();
  else if(a==="subs")showSubs();
  else if(a==="moderate")showModeration();
  else if(a==="edit-login"){e.preventDefault();loginDialog();}
  else if(a==="sign-out"){try{await api("POST","/api/logout",{});}catch(_){}C.canEdit=false;editMode=false;try{localStorage.setItem("gh-edit","0");}catch(_){}await bootData();render();toast("Signed out.");}
  else if(a==="layout"){L=clone(S);render();toast("Click any text to edit it. Use the block tools to add, move or remove things.",5000);}
  else if(a==="layout-cancel"){L=null;bgKey="";render();}
  else if(a==="layout-save"){$$("[data-bind]").forEach(bindEdit);const next=L;const ok=await publishState(next,"Publishing layout…");if(!ok){}}
  else if(a==="site-settings")siteSettings();
  else if(a==="tab-mv"){const t=curTab(),i=L.tabs.indexOf(t),j=i+Number(b.dataset.d);if(j<0||j>=L.tabs.length)return;L.tabs.splice(i,1);L.tabs.splice(j,0,t);render();}
  else if(a==="tab-add"){dialog({title:"New tab",fields:[{k:"n",l:"Tab name",v:""}],ok:"Add tab",onOk:v=>{const n=v.n.trim();if(!n)return "Name the tab.";const t={id:uid("t"),name:n,slug:uniqueSlug(slugify(n),L.tabs,null),cols:3,sort:"date",layout:"grid",showTitle:true,bg:{type:"paper",image:"",dim:.45,grass:true},blocks:[]};L.tabs.push(t);location.hash="t-"+t.slug;render();}});}
  else if(a==="tab-del"){const t=curTab();if(L.tabs.length<2){toast("Keep at least one tab.");return;}const n=L.posts.filter(p=>p.tabId===t.id).length;dialog({title:`Delete “${t.name}”?`,extra:`<p style="color:var(--body);margin:0 0 14px">${n?`Its ${n} post${n>1?"s":""} will move to “${L.tabs.find(x=>x!==t).name}”.`:"It has no posts."} Nothing is removed for visitors until you publish.</p>`,ok:"Delete tab",onOk:()=>{const to=L.tabs.find(x=>x!==t);L.posts.forEach(p=>{if(p.tabId===t.id)p.tabId=to.id;});L.tabs=L.tabs.filter(x=>x!==t);location.hash="t-"+to.slug;render();}});}
  else if(a==="blk-add"){const t=curTab();const ty=b.dataset.type;const blk={id:uid("b"),type:ty,...({heading:{text:"New heading",size:"l"},text:{html:"<p>Write something here.</p>"},image:{src:"",caption:"",width:"full"},imagetext:{src:"",html:"<p>Write something next to the image.</p>",side:"left"},button:{label:"Learn more",href:""},spacer:{h:40},portrait:{},silhouette:{caption:"David Bowie"}}[ty]||{})};t.blocks=t.blocks||[];t.blocks.push(blk);render();if(ty==="image"||ty==="imagetext"||ty==="button")blockAfterAdd(blk);}
  else if(a==="blk-up"||a==="blk-down"){const fb=findBlock(b.dataset.id);const j=fb.i+(a==="blk-up"?-1:1);if(j<0||j>=fb.t.blocks.length)return;fb.t.blocks.splice(fb.i,1);fb.t.blocks.splice(j,0,fb.b);render();}
  else if(a==="blk-del"){const fb=findBlock(b.dataset.id);fb.t.blocks.splice(fb.i,1);render();}
  else if(a==="blk-opts"){blockOpts(findBlock(b.dataset.id).b);}
  else if(a==="tab-bg-up"){const t=curTab();const [f]=await pickFiles("image/*");const u=await upload(f);if(u){t.bg=t.bg||{};t.bg.type="image";t.bg.image=u;t.bg.dim=t.bg.dim??.45;render();}}
  else if(a==="blk-img"){const fb=findBlock(b.dataset.id);const [f]=await pickFiles("image/*");const u=await upload(f);if(u){fb.b.src=u;render();}}
  else if(a==="mv-post"){e.preventDefault();const t=curTab();const ps=L.posts.filter(p=>p.tabId===t.id).sort((x,y)=>(x.order??0)-(y.order??0));const i=ps.findIndex(p=>p.id===b.dataset.id),j=i+Number(b.dataset.d);if(j<0||j>=ps.length)return;[ps[i],ps[j]]=[ps[j],ps[i]];ps.forEach((p,k)=>p.order=k);render();}
  else if(a==="edit-toggle"){editMode=!editMode;try{localStorage.setItem("gh-edit",editMode?"1":"0");}catch(_){}render();toast(editMode?"Editing on. Visitors never see these controls.":"Viewing the site as visitors see it.",3000);}
  else if(a==="cover"){e.preventDefault();e.stopPropagation();const id=b.dataset.id;const [f]=await pickFiles("image/*");const u=await upload(f);if(!u)return;const next=clone(S);const q=next.posts.find(x=>x.id===id);if(!q)return;q.cover=u;publishState(next,"Updating image…");}
  else if(a==="tile"){e.preventDefault();tileDialog(b.dataset.id);}
  else if(a==="pin"){e.preventDefault();e.stopPropagation();const tgt=L||clone(S);const p=tgt.posts.find(x=>x.id===b.dataset.id);if(!p)return;p.pinned=!p.pinned;if(L){render();}else publishState(tgt,p.pinned?"Pinning…":"Unpinning…");}
  else if(a==="like"){likePost(b.dataset.id);}
  else if(a==="vote"){vote(b.dataset.poll,Number(b.dataset.i));}
  else if(a==="sub-dialog"){subDialog();}
  else if(a==="to-comments"){e.preventDefault();$("#comments")&&$("#comments").scrollIntoView({behavior:reduce?"auto":"smooth"});}
  else if(a==="del-comment"){delComment(b.dataset.cid);}
});
function blockAfterAdd(blk){if(blk.type==="button")blockOpts(blk);else{(async()=>{const [f]=await pickFiles("image/*");const u=await upload(f);if(u){blk.src=u;render();}})();}}
document.addEventListener("submit",e=>{const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  if(f.dataset.form==="sub")subscribe($("input",f).value,$("#s-msg"));
  if(f.dataset.form==="comment")postComment(f.dataset.id,$("#c-text").value);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#dlg"))return;if($(".reader")&&!E){location.hash="t-"+curTab().slug;return;}if($(".preview-wrap")){$(".preview-wrap").remove();return;}if($(".drawer")){$(".drawer").remove();return;}}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches('span.b[data-act="sub-dialog"]')){e.preventDefault();subDialog();}});
function subDialog(){if(C.subscribed){toast("You're already subscribed.");return;}dialog({title:"Subscribe to "+V().site.title,fields:[{k:"email",l:"Email",t:"email",v:"",ph:"you@example.com"}],ok:"Subscribe",onOk:v=>{subscribe(v.email,null).then(ok=>{if(ok)toast("You're subscribed. Welcome!",5000);});}});}

/* ---------- social writes ---------- */
async function loadSocial(){try{const x=await api("GET","/api/social");cache.likes=x.likes||{};cache.mine=x.mine||{};cache.polls=x.polls||{};cache.comments=x.comments||{};}catch(_){}}
async function likePost(pid){
  const was=!!cache.mine[pid];if(was)delete cache.mine[pid];else cache.mine[pid]=true;
  cache.likes[pid]=Math.max(0,(cache.likes[pid]||0)+(was?-1:1));refreshSocial();
  try{const r=await api("POST","/api/like",{postId:pid});cache.likes[pid]=r.count;if(r.mine)cache.mine[pid]=true;else delete cache.mine[pid];refreshSocial();}
  catch(_){await loadSocial();refreshSocial();toast("Couldn't save your like.");}}
async function vote(pollId,i){
  const p=cache.polls[pollId]||(cache.polls[pollId]={counts:{},mine:null});
  if(p.mine!==null&&p.mine!==undefined)p.counts[p.mine]=Math.max(0,(p.counts[p.mine]||0)-1);
  p.mine=i;p.counts[i]=(p.counts[i]||0)+1;refreshSocial();
  try{await api("POST","/api/vote",{pollId,choice:i});}catch(_){await loadSocial();refreshSocial();toast("Couldn't record your vote.");}}
async function postComment(pid,text){
  text=String(text||"").trim();if(!text)return;
  const nameEl=$("#c-name"),name=nameEl?nameEl.value.trim():"",hp=$("#c-hp");
  try{const r=await api("POST","/api/comment",{postId:pid,name,body:text,hp:hp?hp.value:""});
    if(name)ls.set("sn-name",name);const ta=$("#c-text");if(ta)ta.value="";
    if(r.status==="approved"){await loadSocial();refreshSocial();toast("Comment posted.");}else toast("Thanks! Your comment will appear once it's approved.",5000);
  }catch(e){toast(e.message||"Couldn't post your comment.",4000);}}
async function delComment(cid){
  try{const r=await api("POST","/api/comments",{id:cid,action:"delete"});cache.pending=r.pending;await loadSocial();refreshSocial();}catch(_){toast("Couldn't delete that comment.");}}

/* ---------- owner panels ---------- */
function showDrafts(){const ds=[...cache.drafts].sort((a,b)=>b.updatedAt-a.updatedAt);
  const d=dialog({title:"Drafts",ok:null,extra:ds.length?`<div class="list">${ds.map(x=>`<div class="it"><span>${esc(x.title||"Untitled")}<br><span class="m">${esc(tabName(x.tabId))} · saved ${esc(ago(x.updatedAt))}${x.isNew?"":" · changes to a published post"}</span></span><span style="display:flex;gap:6px"><button class="btn xs" data-dr="open" data-id="${esc(x.id)}">Open</button><button class="btn xs danger" data-dr="del" data-id="${esc(x.id)}">Delete</button></span></div>`).join("")}</div>`:`<p style="color:var(--muted)">No drafts. Drafts save automatically while you write.</p>`});
  d.root.addEventListener("click",e=>{const b=e.target.closest("[data-dr]");if(!b)return;const x=cache.drafts.find(y=>y.id===b.dataset.id);if(b.dataset.dr==="open"){d.close();openEditor(x,!!x.isNew);}else{deleteDraft(x.id).then(()=>{d.close();showDrafts();});}});}
const confirmedCount=()=>cache.subs.filter(x=>x.status==="confirmed").length;
function loginDialog(){
  const d=dialog({title:"Edit this site",extra:`<p style="color:var(--body);margin:0 0 14px">Enter the edit password to change the site.</p>`,fields:[{k:"pw",l:"Password",t:"password",v:""}],ok:"Edit",
    onOk:v=>{
      if(!v.pw)return "Enter the password.";
      api("POST","/api/login",{password:v.pw}).then(async()=>{
        d.close();C.canEdit=true;editMode=true;try{localStorage.setItem("gh-edit","1");}catch(_){}
        await bootData();render();toast("Editing on. Visitors never see these controls.",4000);
      }).catch(e=>{const el=$("#dlg-err");if(el)el.textContent=e.message||"Couldn't sign in.";});
      return "Checking…";
    }});
}
async function showSubs(){
  let data;try{data=await api("GET","/api/subscribers");}catch(_){toast("Couldn't load subscribers.");return;}
  cache.subs=data.subscribers;const c=data.counts;const note=data.notifications[0];updNav();
  const d=dialog({title:`Subscribers · ${c.confirmed}`,ok:null,extra:`<p style="color:var(--muted);margin:0 0 14px;font-size:14px">${c.confirmed} confirmed${c.pending?`, ${c.pending} waiting to confirm`:""}${c.unsubscribed?`, ${c.unsubscribed} unsubscribed`:""}. New posts are emailed to confirmed subscribers automatically.</p>
   ${note?`<p style="margin:0 0 14px;font-size:13.5px;color:${note.last_error?"var(--danger)":"var(--muted)"}">Last post emailed: “${esc(note.title)}”, ${note.state==="done"?`sent to ${note.sent}`:`${note.sent} sent so far`}${note.last_error?`. Problem: ${esc(note.last_error)}`:"."}</p>`:""}
   ${data.subscribers.length?`<div class="list">${data.subscribers.map(x=>`<div class="it"><span>${esc(x.email)}<br><span class="m">${esc(x.status)}</span></span><span style="display:flex;gap:8px;align-items:center"><span class="m">${esc(new Date(x.created_at).toLocaleDateString())}</span><button class="btn xs danger" data-rm="${esc(x.id)}">Remove</button></span></div>`).join("")}</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm" data-copy>Copy confirmed emails</button><a class="btn sm" href="/api/subscribers.csv" download>Download CSV</a></div>`:`<p style="color:var(--muted)">No subscribers yet.</p>`}`});
  d.root.addEventListener("click",async e=>{
    if(e.target.closest("[data-copy]")){const t=cache.subs.filter(x=>x.status==="confirmed").map(x=>x.email).join(", ");try{await navigator.clipboard.writeText(t);toast("Copied "+confirmedCount()+" emails");}catch(_){toast("Couldn't copy. Use Download CSV instead.");}return;}
    const rm=e.target.closest("[data-rm]");if(rm){try{await api("DELETE","/api/subscribers?id="+encodeURIComponent(rm.dataset.rm));d.close();showSubs();}catch(_){toast("Couldn't remove that subscriber.");}}});
}
async function showModeration(){
  let data;try{data=await api("GET","/api/comments?status=pending");}catch(_){toast("Couldn't load comments.");return;}
  cache.pending=data.pending;updNav();
  const ttl=id=>{const p=S.posts.find(x=>x.id===id);return p?p.title:"(deleted post)";};
  const d=dialog({title:`Comments to review · ${data.comments.length}`,ok:null,extra:data.comments.length?`<div class="list">${data.comments.map(c=>`<div class="it" data-cm="${esc(c.id)}" style="display:block"><div class="m" style="margin-bottom:4px">${esc(c.name)} on “${esc(ttl(c.post_id))}” · ${esc(ago(c.created_at))}</div><div style="color:var(--body);margin-bottom:8px;white-space:pre-wrap">${esc(c.body)}</div><div style="display:flex;gap:6px"><button class="btn xs" data-cmact="approve">Approve</button><button class="btn xs" data-cmact="reject">Reject</button><button class="btn xs danger" data-cmact="delete">Delete</button></div></div>`).join("")}</div>`:`<p style="color:var(--muted)">Nothing waiting. New comments show up here before anyone else sees them.</p>`});
  d.root.addEventListener("click",async e=>{const b=e.target.closest("[data-cmact]");if(!b)return;const row=b.closest("[data-cm]");
    try{const r=await api("POST","/api/comments",{id:row.dataset.cm,action:b.dataset.cmact});cache.pending=r.pending;row.remove();updNav();await loadSocial();refreshSocial();}catch(_){toast("Couldn't update that comment.");}});
}

/* ---------- boot ---------- */
async function loadOwnerData(){
  try{cache.drafts=(await api("GET","/api/drafts")).drafts;}catch(_){}
  try{cache.subs=(await api("GET","/api/subscribers")).subscribers;}catch(_){}
  try{cache.pending=(await api("GET","/api/comments?status=pending")).pending;}catch(_){}
}
async function bootData(){
  try{
    const r=await api("GET","/api/site");
    Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,r.site);
    C.version=r.version;C.canEdit=!!(r.me&&r.me.admin);C.subscribed=!!(r.me&&r.me.subscribed);
  }catch(_){/* offline or server trouble: fall back to the copy that shipped in this page */}
  await loadSocial();
  if(C.canEdit)await loadOwnerData();else{cache.drafts=[];cache.subs=[];cache.pending=0;}
}
(async()=>{
  await bootData();
  const skipIntro=!S.site.loader.on||ss.get("sn-launched")==="1";
  loaderUp=!skipIntro;if(loaderUp)applySky(true);
  render();
  if(skipIntro){loader.remove();$("#site").classList.remove("pre");}else{document.body.classList.add("noscroll");runLoader();}
  if(C.subscribed){const m=$("#l-msg");if(m){m.textContent="You're already subscribed.";m.className="submsg ok";}}
  const sp=new URLSearchParams(location.search).get("s");
  if(sp){toast(sp==="confirmed"?"You're subscribed. Welcome!":"That confirmation link isn't valid.",5000);history.replaceState(null,"",location.pathname+location.hash);}
})();
function updNav(){const n=$(".nav");if(n){const t=document.createElement("div");t.innerHTML=navHTML(curTab());n.replaceWith(t.firstChild);}}
})();
</script>
</body></html>
